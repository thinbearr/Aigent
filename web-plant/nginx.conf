server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri $uri/ /index.html; }

  # Plant operator + evidence API  (plant backend, port 8000)
  location /api/      { proxy_pass http://plant-api:8000; }
  location /evidence/ { proxy_pass http://plant-api:8000; }
  # Developer / range-control API  (plant backend, port 8100)
  location /dev/      { proxy_pass http://plant-api:8100; }
}
