server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri $uri/ /index.html; }

  # Investigation API (agent backend, port 8200). The agent backend itself
  # reaches the plant over the Docker network; this UI never talks to the plant.
  location /agent/ { proxy_pass http://agent-api:8200; }
}
